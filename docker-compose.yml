services:

  db:
    image: postgres:17
    container_name: books_db

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: books_api

    env_file:
      - .env

    depends_on:
      - db

    ports:
      - "8000:8000"

volumes:
  postgres_data: